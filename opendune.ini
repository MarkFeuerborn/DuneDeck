; opendune.ini for the T-Deck port.
; This file must live at /dune2/opendune.ini on the SD card (same folder
; as DUNE.PAK etc.) - see README.md.
[opendune]

; supported languages are : english, french and german
; (french/german need EU or HitSquad-version data files - see README.md)
language=english

; Data/save directories, matching this port's SD card layout. These
; actually match the built-in T-Deck defaults already (see file.c), so
; setting them here is redundant but explicit/robust - if you ever store
; your data somewhere else on the card, change these two lines.
datadir=/sdcard/dune2
savedir=/sdcard/dune2/save

; --- The following upstream options do NOT apply to this port ---
; scalefactor / scalefilter: the T-Deck driver (video_tdeck.cpp) always
; renders natively at 320x200 centered on the panel and ignores both of
; these entirely - there's no scaling to configure.
;scalefactor=2
;scalefilter=scale2x

; fullscreen: meaningless on an embedded target with no windowing system.
;fullscreen=1

; framerate: 60 (the built-in default) already matches the engine's
; internal tick rate; only change this if you have a specific reason to.
;framerate=60

; mt32midi: the port now has music (a built-in software synthesizer, see
; README.md "Music"). Leave this UNSET (0): that plays Dune II's
; General-MIDI (.C55, Roland SC-55) tracks, which is what the synthesizer
; is designed for. Setting it to 1 selects the MT-32 (.XMI) tracks instead,
; which use MT-32 instrument numbering and will sound wrong here.
; mt32rompath is for the desktop "munt" emulator and does nothing here.
; Music volume and an on/off switch are compile-time settings in
; src/tdeck_config.h (TDECK_MUSIC_VOLUME / TDECK_ENABLE_MUSIC).
;mt32midi=1
;mt32rompath=/home/user/mt32roms

; Game behaviour options - defaults are fine unless you want to change them.
;dune2_enhanced=0
;startport_unit_cap=1

; DEBUG options - leave off for normal play.
;debug_game=1
;debug_scenario=1
;debug_skip_dialogs=1
;debug_log_game=1
