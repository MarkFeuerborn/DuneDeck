; OpenDUNE for the LilyGO T-Deck
;
; Build with:  pio run
; Flash with:  pio run -t upload
; (or install the produced .bin via bmorcelli Launcher - see README.md)
;
; Open this folder in VS Code with the PlatformIO extension, or in Visual
; Studio via the VisualGDB extension if you want it inside VS proper - see
; README.md for why plain MSVC/Visual Studio can't target this chip
; directly (it's a cross-compiled Xtensa target, not x86).

[env:tdeck]
platform = espressif32@6.5.0    ; intended to pin arduino-esp32 2.0.x (see README.md "Toolchain notes"), but confirm what actually resolves in your environment - a build log we've seen resolved framework-arduinoespressif32@3.20014.231204 (a 3.x/IDF5 core) despite this pin, which changes the I2S driver API dsp_tdeck.cpp uses. If your build fails inside dsp_tdeck.cpp with driver/i2s.h errors, that's why - see README.md.
board = esp32-s3-devkitc-1
framework = arduino

; T-Deck module is ESP32-S3FN16R8: 16MB flash, 8MB Octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions_tdeck.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lewisxhe/SensorLib @ ^0.1.9   ; only actually compiled in if TDECK_HAS_TOUCH=1 (see tdeck_config.h) - harmless to fetch otherwise

build_flags =
    -DTDECK
    -DTDECK_HAS_TOUCH=0          ; set to 1 only on a T-Deck PLUS (GT911 touch panel) - see tdeck_config.h
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -include src/User_Setup_TDeck.h
    -Wno-unused-parameter

    ; Route Arduino's Serial object to the native USB CDC interface rather
    ; than a hardware UART. The T-Deck (like most ESP32-S3 boards) has no
    ; separate UART-to-USB bridge chip - its USB port IS the native USB
    ; peripheral. Without these flags, Serial defaults to UART0, which may
    ; not be connected to anything reachable, while the engine's own
    ; Warning()/Error() calls (routed via a separate ESP-IDF console
    ; mechanism, not Arduino's Serial) still work - which would explain
    ; why main.cpp's own Serial.println()/printf() diagnostics have never
    ; shown up in any serial log so far, despite the code running. See
    ; README.md "Troubleshooting" for the full story.
    ;
    ; KNOWN TRADEOFF: some ESP32-S3 boards/core versions delay booting
    ; until a USB host (e.g. a serial monitor) actually connects, when
    ; this is enabled. If OpenDUNE stops starting standalone on battery
    ; (only booting once a PC/monitor is attached), that's why - remove
    ; these two flags to restore standalone boot once we're done needing
    ; guaranteed Serial visibility for debugging.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
